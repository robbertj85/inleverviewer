# Front container for prototype.transportlab.app/inleverpuntenviewer/.
# Nginx Proxy Manager forwards the path unchanged (no URI rewrite), so every
# location here carries the /inleverpuntenviewer prefix.
#
#   /inleverpuntenviewer/data/*              -> site volume, current release
#   /inleverpuntenviewer/municipalities.json -> site volume, current release
#   everything else                          -> Next.js (app-inleverpuntenviewer: pages, _next, /api/*)
#
# Proxy to the static container name, never the service name `app`: this
# container is also on the shared coolify network, where other applications'
# `app` services answer to that bare name.
#
# `current` is a symlink the worker swaps atomically after each weekly run;
# nginx resolves it per request, so a reader never sees a half-written file.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/geo+json application/yaml text/plain text/css application/javascript;

# NPM's custom location sets X-Real-IP (and X-Forwarded-For) to the client
# address, overwriting whatever the client sent. The app rate-limits on the
# first X-Forwarded-For entry, so pass that address on as the only entry
# instead of appending ours. Without NPM in front (local test) use the peer.
map $http_x_real_ip $client_ip {
  ""      $remote_addr;
  default $http_x_real_ip;
}

server {
  listen 80;
  server_name _;

  # Data changes weekly: always revalidate. nginx answers conditional requests
  # with 304, so repeat visits stay cheap and nobody sees last week's data.
  location /inleverpuntenviewer/data/ {
    alias /srv/inlever/site/current/data/;
    types {
      application/geo+json geojson;
      application/json json;
    }
    add_header Cache-Control "public, no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin * always;
  }

  location = /inleverpuntenviewer/municipalities.json {
    alias /srv/inlever/site/current/municipalities.json;
    default_type application/json;
    add_header Cache-Control "public, no-cache" always;
    add_header Access-Control-Allow-Origin * always;
  }

  # NPM's custom location is "/inleverpuntenviewer/" and 301s the bare path to
  # it; Next (trailingSlash off) 308s "/inleverpuntenviewer/" back to the bare
  # path. Serve the slash form as the bare path internally to break the loop.
  location = /inleverpuntenviewer/ {
    proxy_pass http://app-inleverpuntenviewer:3000/inleverpuntenviewer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /inleverpuntenviewer {
    proxy_pass http://app-inleverpuntenviewer:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
