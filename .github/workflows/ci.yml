name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The weekly data run rewrites every GeoJSON file, so the data-integrity
  # tests are worth running against the result rather than only against code
  # changes.
  workflow_run:
    workflows: ['Update inleverpunten data']
    types: [completed]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` runs the TypeScript check, so a type error fails here.
      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright starts the production server itself (see webServer in
      # playwright.config.ts) and tears it down afterwards.
      - name: Test
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webapp/playwright-report/
          retention-days: 7
