name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v7
        with:
          # The data is no longer tracked (the VPS worker writes it to a
          # volume), but the API and data-integrity tests need a dataset: use
          # the last one that was committed, from history.
          fetch-depth: 0

      - name: Restore last committed dataset
        working-directory: .
        run: |
          rev=$(git log -1 --format=%H --diff-filter=AM -- webapp/public/data/summary.json)
          echo "dataset from $(git log -1 --format='%h %cs' "$rev")"
          git archive "$rev" webapp/public/data webapp/public/municipalities.json | tar -x

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` runs the TypeScript check, so a type error fails here.
      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright starts the production server itself (see webServer in
      # playwright.config.ts) and tears it down afterwards.
      - name: Test
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: webapp/playwright-report/
          retention-days: 7
